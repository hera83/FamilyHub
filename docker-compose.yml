# Family Hub – serveren i homelab'en.
#
#   1. cp .env.example .env    og udfyld .env (port, data, Google-nøgler)
#   2. docker compose up -d --build
#
# Køkkenskærmen (Raspberry Pi i kiosktilstand) åbner derefter http://<server>:8080.
# Værdierne ${…} kommer fra .env i samme mappe. Se README.md.

name: familyhub

services:
  familyhub:
    build: .
    image: familyhub:latest
    container_name: familyhub
    restart: unless-stopped

    # Fast: containerens port 8080 udstilles som 8080 på alle serverens netkort. Ikke til at ændre i .env.
    ports:
      - "8080:8080"

    environment:
      TZ: ${FAMILYHUB_TIMEZONE:-Europe/Copenhagen}
      FamilyHub__TimeZone: ${FAMILYHUB_TIMEZONE:-Europe/Copenhagen}
      # Tom = ikke sat op endnu. Kalenderen viser så, hvad der mangler.
      FamilyHub__Calendar__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      FamilyHub__Calendar__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # Madplanens opskrifter. Tom nøgle = ikke sat op endnu. Se docs/opskrifter-api.md.
      FamilyHub__MealPlan__Recipes__BaseUrl: ${RECIPES_API_URL:-https://opskriftsbog.ramskov.pro/api/v1}
      FamilyHub__MealPlan__Recipes__ApiKey: ${RECIPES_API_KEY:-}
      # Printserveren (Print API). Tom adresse eller nøgle = ikke sat op. Se docs/printer.md.
      FamilyHub__Printing__BaseUrl: ${PRINT_API_URL:-}
      FamilyHub__Printing__ApiKey: ${PRINT_API_KEY:-}
      FamilyHub__Printing__PrinterId: ${PRINT_PRINTER_ID:-}
      # Blodsukker (familiens API foran Dexcom). Tom nøgle = ikke sat op. Se docs/dexcom.md.
      FamilyHub__Dexcom__BaseUrl: ${DEXCOM_API_URL:-https://dexcom.appcore.cc}
      FamilyHub__Dexcom__ApiKey: ${DEXCOM_API_KEY:-}
      # Opskrifter fra Mambeno (familiens API foran Mambeno). Tom nøgle = ikke sat op. Se docs/mambeno.md.
      FamilyHub__Mambeno__BaseUrl: ${MAMBENO_API_URL:-https://mambeno.appcore.cc}
      FamilyHub__Mambeno__ApiKey: ${MAMBENO_API_KEY:-}

    volumes:
      # Et navn = Docker-volumen. En sti (./data, /mnt/ssd/familyhub) = mappe på serveren.
      - ${FAMILYHUB_DATA:-familyhub-data}:/data

    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  familyhub-data:
